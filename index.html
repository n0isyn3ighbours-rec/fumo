<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060708">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUMO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="color-scheme" content="dark light">
<meta name="description" content="FUMO — a personal command centre for running an agency: clients, focus, follow-ups and recovery. Your data stays in this browser.">
<title>FUMO · Command Centre</title>
<script>try{var t=localStorage.getItem('fumo.ui.theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
/* FUMO V0.3 — one stylesheet, built on tokens. Themes only swap tokens. */
:root{
  color-scheme:dark;
  --bg:#060708;--frame:#0b0d0e;--side:linear-gradient(150deg,#111416,#0a0c0d 70%);--side-end:#0a0c0d;
  --surface:#101315;--surface-2:#161a1c;--surface-3:#1c2124;--hover:#20262a;
  --border:#262c2f;--border-strong:#363e42;
  --text:#f2f4f4;--text-2:#cdd3d5;--muted:#a2aaad;--faint:#858d91;--kicker:#bcc5c9;
  --accent:#e4e9ea;--on-accent:#101416;--focus:#b9cdc8;
  --btn:#1b2023;--btn-hover:#272e32;--input:#121618;
  --track:#252c2f;--fill:#dfe5e7;--spark:#7f898d;
  --good:#9cc8b4;--good-bg:#17291f;--warn:#e0bb8f;--warn-bg:#2b2319;--bad:#eda3a3;--bad-bg:#2d1b1c;
  --paper:#e8e7e3;--paper-ink:#171a1c;--paper-muted:#555c5f;--paper-line:#cfcdc6;
  --shadow:0 18px 50px #0007;--scrim:#020405cc;
  --dot-a:#7c9e98;--dot-b:#ab8798;--dot-c:#bb9d78;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#e4e5e1;--frame:#f3f3f0;--side:linear-gradient(150deg,#f1f2ef,#e6e8e6);--side-end:#e6e8e6;
  --surface:#fbfbf9;--surface-2:#ffffff;--surface-3:#eef0ee;--hover:#e5e8e7;
  --border:#d8dddd;--border-strong:#c1cacd;
  --text:#141c21;--text-2:#2c383f;--muted:#53616a;--faint:#5a6870;--kicker:#46565f;
  --accent:#18232a;--on-accent:#f7f8f8;--focus:#2f5f6e;
  --btn:#f0f2f1;--btn-hover:#e3e8e8;--input:#ffffff;
  --track:#dde3e4;--fill:#2d4552;--spark:#7d8c93;
  --good:#2e6a53;--good-bg:#dff0e7;--warn:#87561f;--warn-bg:#f4e7d4;--bad:#a13a3a;--bad-bg:#f7dfdf;
  --paper:#1a2125;--paper-ink:#f1f1ee;--paper-muted:#aab3b7;--paper-line:#3a4448;
  --shadow:0 18px 50px #1a283026;--scrim:#1b262c99;
  --dot-a:#4f7f78;--dot-b:#94677d;--dot-c:#9c7b4f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.1px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(26px,2.4vw,36px);font-weight:550;letter-spacing:-1px;line-height:1.2}
h1:focus{outline:none}
h2{font-size:17px;font-weight:550;letter-spacing:-.35px}
h3{font-size:14px;font-weight:600}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{width:17px;height:17px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.faint{color:var(--faint)}.hint{font-size:12px;color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.flex1{flex:1;min-width:0}
.stack{display:grid;gap:16px;align-content:start}
.mt{margin-top:16px}.mt-s{margin-top:10px}.mb{margin-bottom:16px}

/* Shell */
.app{--sidew:220px;display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);width:calc(100% - 32px);max-width:1800px;min-height:calc(100vh - 32px);margin:16px auto;border:1px solid var(--border);border-radius:18px;background:linear-gradient(90deg,var(--side-end) var(--sidew),var(--frame) var(--sidew));overflow:clip}
.app.collapsed{--sidew:72px}
.sidebar{position:sticky;top:16px;height:calc(100vh - 34px);display:flex;flex-direction:column;padding:24px 14px 16px;background:var(--side);overflow-y:auto;overflow-x:hidden}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 28px 8px}
.logotype{font:650 26px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-1.4px}
.nav{display:grid;gap:3px}
.nav button,.quick button{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:0 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;text-align:left;white-space:nowrap}
.nav button:hover,.quick button:hover{background:var(--hover);color:var(--text)}
.nav button[aria-current=page]{background:var(--surface-3);border-color:var(--border-strong);color:var(--text)}
.nav .count{margin-left:auto;min-width:20px;text-align:right;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.quick{margin-top:26px;display:grid;gap:2px}
.quick-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--faint);padding:0 12px 8px}
.sidefoot{margin-top:auto;padding:16px 4px 0;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:600;color:var(--on-accent);background:var(--accent)}
.profile-label{flex:1;min-width:0;line-height:1.35}
.profile-label strong{display:block;font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-label span{font-size:11px;color:var(--faint)}
.app.collapsed .sidebar{padding-inline:11px}
.app.collapsed .brandrow{justify-content:center;margin-inline:0}
.app.collapsed :is(.logo,.label,.quick-label,.profile-label,.sidefoot .icon-button,.nav .count){display:none}
.app.collapsed :is(.nav button,.quick button){justify-content:center;padding:0}
.app.collapsed .sidefoot{justify-content:center}
.icon-button{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--muted)}
.icon-button:hover{background:var(--hover);color:var(--text)}
.backdrop{display:none}
.main{min-width:0;padding:26px 30px 30px;border-left:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:30px;min-height:38px}
.mobile-menu{display:none}
.search-trigger{display:flex;align-items:center;gap:10px;width:300px;max-width:42vw;height:38px;padding:0 14px;border:1px solid var(--border-strong);border-radius:24px;background:var(--surface);color:var(--faint);font-size:13px;text-align:left}
.search-trigger:hover{color:var(--text)}
.search-trigger .icon{width:15px;height:15px}
.search-trigger kbd{margin-left:auto;font:11px system-ui;color:var(--faint);border:1px solid var(--border-strong);padding:1px 5px;border-radius:4px}
.topright{margin-left:auto;display:flex;align-items:center;gap:6px}
.clock{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin-right:6px;white-space:nowrap}
.timer-chip{display:none;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:30px;border:1px solid var(--border-strong);background:var(--surface-3);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
.timer-chip.on{display:inline-flex}
.timer-chip i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:18px;border-top:1px solid var(--border);font-size:11px;color:var(--faint)}

/* Building blocks */
.panel{min-width:0;padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.panelhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sub{font-size:12px;color:var(--faint);margin-top:2px}
.kicker{font-size:11px;font-weight:650;letter-spacing:2px;text-transform:uppercase;color:var(--kicker);margin-bottom:10px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.pagehead h1{font-size:clamp(26px,2.4vw,32px)}
.lead{color:var(--muted);font-size:14px;margin-top:8px;max-width:640px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:1/-1}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 13px;border:1px solid var(--border-strong);border-radius:9px;background:var(--btn);color:var(--text);font-size:13px;white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn .icon{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:550}
.btn.primary:hover{filter:brightness(1.1)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--hover);color:var(--text)}
.btn.small{min-height:30px;padding:4px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.text-button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 0}
.text-button:hover{color:var(--text);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border:0;border-radius:99px;background:var(--surface-3);color:var(--text-2);font-size:11px;white-space:nowrap;line-height:1.6}
button.pill:hover{color:var(--text)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.progress{height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.progress>div{height:100%;border-radius:9px;background:var(--fill);transition:width .3s}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.listrow:last-child{border-bottom:0}
.listrow.done .itemname{text-decoration:line-through;color:var(--faint)}
.itemname{font-size:13px;font-weight:550;overflow-wrap:anywhere}
.itemname.plain{font-weight:450}
a.itemname{text-decoration:none}
a.itemname:hover{text-decoration:underline}
.itemdetail{font-size:12px;color:var(--faint);overflow-wrap:anywhere}
.check{width:17px;height:17px;flex:none;accent-color:var(--fill);cursor:pointer}
.empty{padding:24px 12px;text-align:center;color:var(--faint);font-size:13px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--faint)}
.micro{font-size:12px;color:var(--muted)}
.divider{border:0;border-top:1px solid var(--border);margin:16px 0}
.field{display:grid;gap:6px}
.field label{font-size:12px;color:var(--muted)}
.fields{display:grid;gap:13px}
.field2{grid-template-columns:1fr 1fr}
.input,select,textarea{width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--input);color:var(--text);outline:none}
textarea{min-height:90px;resize:vertical}
.input::placeholder,textarea::placeholder{color:var(--faint)}
.input:focus,select:focus,textarea:focus{border-color:var(--focus)}
.choice{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.choice input{margin-top:2px}
.capture{display:flex;gap:8px}
.capture .input{flex:1;min-width:0}
.alert{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:11px 14px;border:1px solid var(--warn);border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.alert .btn{margin-left:auto}

/* Command Centre */
.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:0 2px 26px}
.hero-date{font-size:13px;color:var(--muted);margin-bottom:8px}
.hero .lead{font-size:15px;color:var(--text-2)}
.hero-quote{font:14px/1.6 Georgia,serif;color:var(--text-2);text-align:right;max-width:230px;margin:0}
.hero-quote p{font:11px system-ui;letter-spacing:1px;color:var(--faint);margin-top:6px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.metric{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;height:128px;padding:18px 20px;border:1px solid var(--border-strong);border-radius:15px;background:var(--surface);color:var(--text);text-align:left;overflow:hidden}
.metric:hover{border-color:var(--muted)}
.statlabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-2)}
.metric-number{font-size:31px;font-weight:550;letter-spacing:-1.2px;line-height:1.1;margin:8px 0 3px}
.metric-number small{font-size:14px;letter-spacing:0;margin-left:2px;color:var(--muted)}
.metric-foot{font-size:12px;color:var(--muted);max-width:62%;line-height:1.4}
.spark{position:absolute;right:18px;bottom:22px;display:flex;align-items:flex-end;gap:4px;width:66px;height:58px}
.spark.static{position:static;width:70px;height:34px;flex:none}
.spark i{flex:1;min-height:4px;border-radius:3px;background:var(--spark)}
.spark i.zero{background:var(--track);max-height:4px}
.spark i.today{background:var(--fill)}
.ring{position:absolute;right:18px;top:50%;width:62px;height:62px;margin-top:-31px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:var(--track);stroke-width:5}
.ring .value{stroke:var(--fill);stroke-linecap:round}
.dots{position:absolute;right:18px;bottom:24px;display:grid;gap:8px;width:62px}
.dots i{display:flex;align-items:center;gap:7px}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dots b.off{background:var(--spark)}
.dots span{flex:1;height:2px;background:var(--track)}
.command{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px}
.mission{display:flex;flex-direction:column;min-height:320px;background:radial-gradient(ellipse at 85% 100%,var(--surface-3),transparent 70%),var(--surface)}
.mission h2{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:500}
.mission-icon{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--border-strong);border-radius:50%}
.mission-icon .icon{width:14px;height:14px}
.round{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text)}
.round:hover{border-color:var(--muted)}
.tag{display:inline-flex;align-self:flex-start;padding:3px 11px;border:1px solid var(--border-strong);border-radius:50px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--warn);background:var(--warn-bg)}
.tag.win{color:var(--good);background:var(--good-bg)}
.mission-title{font-size:21px;font-weight:520;letter-spacing:-.5px;line-height:1.4;margin-top:12px;max-width:660px;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.mission-desc{font-size:13px;color:var(--muted);line-height:1.65;margin-top:8px}
.mission-body{flex:1}
.mission-bottom{display:flex;align-items:center;gap:22px;margin-top:22px}
.progress-line{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted)}
.mission-meta{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted)}
.mission-meta .icon{width:14px;height:14px}
.play{display:grid;place-items:center;width:50px;height:50px;flex:none;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);box-shadow:0 6px 20px #0004}
.play:hover{transform:translateY(-1px)}
.play .icon{width:19px;height:19px;fill:currentColor;stroke-width:1}
.agenda .panelhead{padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:4px}
.agenda-line{display:grid;grid-template-columns:46px 10px minmax(0,1fr) auto;align-items:start;gap:12px;padding:9px 0 3px;min-height:46px;cursor:pointer}
.agenda-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.agenda-check{appearance:none;-webkit-appearance:none;position:relative;width:10px;height:10px;margin:5px 0 0;border-radius:50%;border:1px solid var(--dot-a);background:var(--dot-a);cursor:pointer}
.agenda-line:nth-child(3n+2) .agenda-check{border-color:var(--dot-b);background:var(--dot-b)}
.agenda-line:nth-child(3n) .agenda-check{border-color:var(--dot-c);background:var(--dot-c)}
.agenda-check:checked{background:transparent}
.agenda-check:before{content:'';position:absolute;left:3.5px;top:12px;width:1px;height:30px;background:var(--border)}
.agenda-line:last-child .agenda-check:before{display:none}
.agenda-line strong{display:block;font-size:13px;font-weight:500;line-height:1.45}
.agenda-line:hover strong{text-decoration:underline}
.agenda-line.done strong{text-decoration:line-through;color:var(--faint)}
.agenda-detail{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-note{margin-top:8px;font-size:12px;color:var(--muted)}
.section-divider{display:flex;align-items:center;gap:12px;margin:28px 0 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
.section-divider:after{content:'';flex:1;height:1px;background:var(--border)}
.secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.win-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.win-row:last-child{border:0}
.win-num{font-size:11px;font-variant-numeric:tabular-nums;color:var(--faint);width:20px}
.win-row.done .flex1{text-decoration:line-through;color:var(--faint)}
.paper{background:var(--paper);border-color:var(--paper);color:var(--paper-ink)}
.paper .eyebrow,.paper .micro,.paper .itemdetail{color:var(--paper-muted)}
.paper .btn{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.paper .listrow{border-color:var(--paper-line)}
.edition-title{font:38px/1 Georgia,serif;letter-spacing:-1.4px;margin:14px 0 6px}
.edition-title i{font-weight:400}

/* Projects */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips button{min-height:32px;padding:4px 12px;border:1px solid var(--border-strong);border-radius:30px;background:transparent;color:var(--muted);font-size:12px}
.chips button:hover{color:var(--text)}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.projectcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.project{display:flex;flex-direction:column;gap:14px;min-width:0;padding:20px;border:1px solid var(--border-strong);border-radius:14px;background:var(--surface-2)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;gap:10px;min-height:140px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.bcard{display:flex;flex-direction:column;gap:8px;min-width:0;padding:14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface-2);cursor:grab}
.bcard h3{font-size:15px;overflow-wrap:anywhere}
.bcard .row{flex-wrap:wrap;gap:6px}
.bselect{width:auto;min-height:32px;padding:4px 8px;font-size:12px}
.client{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.project h3{font-size:18px;font-weight:550;letter-spacing:-.4px;overflow-wrap:anywhere}
.next{border-left:2px solid var(--border-strong);padding-left:12px}
.next .eyebrow{margin-bottom:3px}
.next p{font-size:13px;overflow-wrap:anywhere}
.blocker{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--bad);overflow-wrap:anywhere}
.blocker .icon{width:14px;height:14px}
.meta-row,.links{display:flex;flex-wrap:wrap;gap:6px}
.linkpill{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 10px;border:1px solid var(--border-strong);border-radius:30px;font-size:12px;color:var(--text-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkpill:hover{border-color:var(--muted);color:var(--text)}
.linkpill .icon{width:13px;height:13px}
.paper .linkpill{border-color:var(--paper-line);color:var(--paper-ink)}
.project .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.barlist{display:grid;gap:12px}
.barlist .row{font-size:13px;margin-bottom:6px}
.log-entry{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.log-entry:last-child{border:0}
.log-entry time{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.modal-section{margin-top:20px}
.modal-section>.eyebrow{margin-bottom:8px}
.loggrid{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px;align-items:end}

/* Focus, rituals, edition */
.timer{padding:30px;border-radius:14px;text-align:center;background:radial-gradient(ellipse at top,var(--surface-3),var(--surface) 70%);border:1px solid var(--border)}
.timer select{display:block;max-width:340px;margin:0 auto 12px}
.timerclock{font-size:clamp(58px,9vw,92px);font-weight:550;letter-spacing:-4px;line-height:1.2;font-variant-numeric:tabular-nums}
.timer .progress{max-width:520px;margin:6px auto 0}
.timerrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.phase{margin-bottom:14px}
.phasehead{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--kicker);margin:14px 0 4px}
.time{min-width:48px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{min-height:118px}
.stat .number{font-size:32px;font-weight:550;letter-spacing:-1px;margin:8px 0 2px}
.breath{display:flex;flex-direction:column;align-items:center;justify-content:center;width:190px;height:190px;margin:28px auto;border-radius:50%;border:2px solid var(--border-strong);background:radial-gradient(circle,var(--surface-3),var(--surface))}
.breathwrap{position:relative;display:grid;place-items:center;width:220px;height:220px;margin:24px auto}
.breathwrap .breath{position:relative;width:150px;height:150px;margin:0}
.breathring{position:absolute;inset:0;overflow:visible}
.breathring circle{fill:none;stroke-width:3}
.breathring .track{stroke:var(--border)}
.breathring .trace{stroke:var(--fill);stroke-linecap:round}
.breathring .tick,.breathring .dot{fill:var(--fill);stroke:none}
.breath b{font-size:22px;font-weight:550}
.breath span{color:var(--muted)}

/* The Daily Edition — editorial design system */
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.edition{min-width:0}
.edition.porcelain{--surface:#f7f4ee;--surface-2:#fffdf8;--surface-3:#ebe5d9;--hover:#ece5d8;--border:#dbd2c2;--border-strong:#c7bca9;--text:#1b1813;--text-2:#3b352d;--muted:#584f45;--faint:#62594e;--kicker:#4d463d;--accent:#1b1813;--on-accent:#f7f4ee;--focus:#6b4f2a;--btn:#efe8db;--btn-hover:#e4dbcb;--input:#fffdf8;--track:#e2d9c8;--fill:#3b352d;--good:#2f6a50;--good-bg:#dfeee3;--warn:#7a4e1b;--warn-bg:#f2e4cf;--bad:#983333;--bad-bg:#f5dcd8;color-scheme:light;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:22px 28px 28px}
.edition-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
.edition-tools .eyebrow{letter-spacing:2.5px}
.masthead{text-align:center;padding:14px 4px 12px;margin:6px 0 0;border-top:1px solid var(--text-2);border-bottom:3px double var(--text-2)}
.masthead h1{font:400 clamp(40px,6.2vw,78px)/1.04 var(--serif);letter-spacing:-1.6px}
.dateline{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dateline button{border:0;background:none;color:inherit;font:inherit;padding:0;text-decoration:underline;text-underline-offset:3px}
.dateline .warn{color:var(--warn)}
.deskbar{display:flex;gap:2px;overflow-x:auto;margin:0 0 26px;border-bottom:1px solid var(--border);scrollbar-width:none}
.deskbar::-webkit-scrollbar{display:none}
.deskbar>:first-child{margin-left:auto}.deskbar>:last-child{margin-right:auto}
.deskbar button{flex:none;min-height:44px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:13px;white-space:nowrap}
.deskbar button:hover{color:var(--text)}
.deskbar button[aria-current=page]{color:var(--text);border-bottom-color:var(--text)}
.notice{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:22px;padding:11px 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-3);font-size:13px;color:var(--text-2)}
.notice>span{flex:1;min-width:200px}
.story-card{position:relative;min-width:0}
.story-card .eyebrow{margin-bottom:6px;color:var(--kicker)}
.story-title{font-family:var(--serif);font-weight:500;letter-spacing:-.2px;line-height:1.2;overflow-wrap:anywhere}
.stretch{all:unset;cursor:pointer;font:inherit;color:inherit}
.stretch:after{content:'';position:absolute;inset:0}
.stretch:focus-visible{outline:none}
.story-card:hover .stretch{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.story-card:focus-within{outline:2px solid var(--focus);outline-offset:6px;border-radius:4px}
.story-card.is-read .story-title{color:var(--muted)}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--faint)}
.read-mark{font-size:11px;text-transform:uppercase;letter-spacing:1px}
.figure{position:relative;overflow:hidden;border-radius:6px;background:var(--surface-3);margin:0 0 12px;aspect-ratio:16/9}
.figure img{display:block;width:100%;height:100%;object-fit:cover}
.story-dek{font-size:15px;line-height:1.6;color:var(--text-2);margin-top:10px}
.front{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:32px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.splash .story-title{font-size:clamp(28px,3.3vw,46px);letter-spacing:-.8px;line-height:1.1}
.front-top{border-left:1px solid var(--border);padding-left:28px}
.section-label{font-size:11px;font-weight:650;letter-spacing:2px;text-transform:uppercase;color:var(--kicker);padding-bottom:10px;border-bottom:2px solid var(--text-2)}
.story-card.top{padding:14px 0;border-bottom:1px solid var(--border)}
.story-card.top:last-child{border-bottom:0}
.top .story-title{font-size:19px}
.desks-grid{display:grid;grid-template-columns:minmax(0,1fr)}
.desk-col{min-width:0;padding:22px 0 18px;border-bottom:1px solid var(--border)}
.desk-name{margin-bottom:12px}
.desk-name .text-button{font-size:11px;font-weight:650;letter-spacing:2px;text-transform:uppercase;color:var(--text);padding:6px 0}
.thumb .figure{aspect-ratio:3/2}
.thumb .story-title{font-size:20px}
.story-card.brief{padding:11px 0;border-top:1px solid var(--border)}
.story-card.brief .story-title{font-size:16px;line-height:1.3}
.end-note{padding:28px 0 4px;text-align:center;font:italic 15px var(--serif);color:var(--faint)}
.desk-head{text-align:center;max-width:760px;margin:4px auto 26px}
.desk-title{font:400 clamp(30px,3.6vw,44px)/1.1 var(--serif);letter-spacing:-.8px;margin-top:4px}
.desk-head .lead{margin:10px auto 0}
.desk-lead{padding-bottom:24px;border-bottom:1px solid var(--border)}
.deskLead .story-title{font-size:clamp(26px,3vw,40px);line-height:1.12}
.deskLead .figure{max-height:480px}
.desk-list{columns:2;column-gap:36px;margin-top:6px}
.desk-list .story-card{break-inside:avoid}
.setup .steps{margin:14px 0 10px;padding-left:20px;display:grid;gap:8px;color:var(--text-2)}
.setup code,.hint code{font-size:12px;padding:1px 5px;border-radius:4px;background:var(--surface-3)}
.article-title{font-size:clamp(26px,3vw,36px);line-height:1.15}
.article-view .figure{margin-bottom:16px}
.article-view figcaption{position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:4px;background:#000b;color:#fff;font-size:11px}
.fieldset{margin:0;padding:12px 14px 14px;border:1px solid var(--border);border-radius:10px}
.fieldset legend{padding:0 6px;font-size:12px;color:var(--muted)}
.weights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.listrow.is-read .itemname{color:var(--muted);font-weight:450}
.edition-preview .preview-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.preview-lead{font:500 26px/1.18 var(--serif);letter-spacing:-.4px;margin:4px 0 8px;overflow-wrap:anywhere}
.headline-link,.stretch-text{all:unset;cursor:pointer;font:inherit;color:inherit}
.headline-link{display:block;font:500 16px/1.3 var(--serif);margin-top:2px;overflow-wrap:anywhere}
.headline-link:hover,.stretch-text:hover{text-decoration:underline}
.headline-link:focus-visible,.stretch-text:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media (min-width:761px) and (max-width:1180px){.desks-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.desk-col:nth-child(odd){padding-right:22px;border-right:1px solid var(--border)}.desk-col:nth-child(even){padding-left:22px}}
@media (min-width:1181px){.desks-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.desk-col{padding:22px}.desk-col:nth-child(3n+1){padding-left:0}.desk-col:nth-child(3n){padding-right:0}.desk-col:not(:nth-child(3n)){border-right:1px solid var(--border)}.desk-col:last-child:nth-child(3n+1){grid-column:1/-1;padding-right:0;border-right:0}.desk-col:last-child:nth-child(3n+1){display:grid}}
@media (min-width:761px) and (max-width:1180px){.desk-col:last-child:nth-child(odd){grid-column:1/-1;padding-right:0;border-right:0}.desk-col:last-child:nth-child(odd){display:grid}}
.desk-col{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:44px;align-items:start}.desk-col .desk-name{grid-column:1/-1}
@media (max-width:980px){.front{grid-template-columns:minmax(0,1fr);gap:18px}.front-top{border-left:0;padding-left:0}.edition-preview .preview-grid{grid-template-columns:minmax(0,1fr);gap:6px}}
@media (max-width:760px){.edition.porcelain{padding:16px;border-radius:12px}.desk-list{columns:1}.weights{grid-template-columns:minmax(0,1fr)}.masthead h1{font-size:44px}.splash .story-title{font-size:30px}}

.insight{margin-top:18px;padding:14px 16px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2)}
.insight p:not(.eyebrow):not(.hint){font-size:14px;line-height:1.6;color:var(--text-2)}
.insight .listrow:last-child{padding-bottom:0}
.markets{margin:0 0 26px}
.markets ul{display:flex;gap:8px;overflow-x:auto;list-style:none;margin:0 0 8px;padding:0;scrollbar-width:none}
.markets ul::-webkit-scrollbar{display:none}
.markets li{flex:0 0 auto;display:grid;grid-template-columns:auto auto;gap:2px 10px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.markets li.stale{opacity:.55}
.mk-name{grid-column:1/-1;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mk-px{font-size:15px;font-weight:550;color:var(--text)}
.mk-chg{font-size:12px;align-self:center;color:var(--muted)}
.mk-chg.up{color:var(--good)}.mk-chg.down{color:var(--bad)}
.radar{margin-bottom:26px;padding:14px 18px 6px;border:1px solid var(--warn);border-radius:12px;background:var(--surface-2)}
.radar .section-label{border-bottom:0;padding-bottom:2px;color:var(--warn)}
.radar .story-card.brief:first-of-type{border-top:0}
/* Overlays */
.modalback{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:var(--scrim);backdrop-filter:blur(6px)}
.modalback.open{display:flex}
.modal{width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:24px;border:1px solid var(--border-strong);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modalactions{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:14px;max-width:400px;padding:11px 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-3);color:var(--text);box-shadow:var(--shadow);font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--text);font-weight:600;text-decoration:underline;padding:4px}
.search-results{display:grid;gap:6px;margin-top:14px;max-height:50vh;overflow:auto}
.search-result{display:block;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);text-align:left}
.search-result:hover,.search-result:focus-visible{background:var(--hover)}
.search-result strong{display:block;font-size:13px;font-weight:550;overflow-wrap:anywhere}
.search-result small{font-size:12px;color:var(--faint)}
.pages{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.pagelist{display:grid;gap:6px}
.pagelist .search-result[aria-current]{background:var(--surface-3);border-color:var(--border-strong)}
.md{font-size:15px;line-height:1.65;color:var(--text-2);overflow-wrap:anywhere}
.md>*+*{margin-top:10px}
.md h2,.md h3,.md h4{color:var(--text);margin-top:18px}
.md h2{font-size:22px}.md h3{font-size:18px}.md h4{font-size:15px}
.md ul,.md ol{margin:0;padding-left:22px}
.md li.task{list-style:none;margin-left:-22px}
.md li.task label{display:flex;gap:8px;align-items:baseline}
.md blockquote{margin:0;padding-left:12px;border-left:3px solid var(--border-strong);color:var(--muted)}
.md code{font:13px ui-monospace,monospace;padding:1px 5px;border-radius:5px;background:var(--surface-3)}
.md a{color:var(--text)}
.wikilink{padding:0;border:0;background:none;font:inherit;color:var(--text);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.wikilink.missing{color:var(--muted);text-decoration-style:dashed}
.pagebody{min-height:50vh;font:14px/1.6 ui-monospace,monospace}
@media (max-width:760px){.pages{grid-template-columns:minmax(0,1fr)}}
.calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cday{display:flex;flex-direction:column;gap:3px;min-width:0;min-height:96px;padding:6px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.cday.out{border-color:transparent;background:transparent}
.cday.today{border-color:var(--text)}
.cnum{align-self:flex-start;min-width:28px;min-height:28px;padding:0 6px;border:0;border-radius:99px;background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.cnum:hover,.cday.has-journal .cnum{background:var(--surface-3)}
.cday.today .cnum{background:var(--accent);color:var(--on-accent)}
.citem{display:block;width:100%;padding:2px 6px;border:0;border-radius:6px;background:var(--surface-3);color:var(--text-2);font-size:11px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.citem.due{background:var(--warn-bg);color:var(--warn)}.citem.renewal{background:var(--bad-bg);color:var(--bad)}.citem.workout{background:var(--good-bg);color:var(--good)}
@media (max-width:760px){.cday{min-height:52px;padding:3px}.citem{height:6px;padding:0;font-size:0}.cal,.calhead{gap:3px}}
.crash{border-color:var(--bad)}

/* Responsive */
@media (max-width:1180px){
  .app{--sidew:196px}
  .main{padding:24px}
  .metrics{gap:12px}
  .metric{padding:16px}
  .spark,.dots{width:50px;right:14px}
  .ring{width:52px;height:52px;margin-top:-26px;right:14px}
  .projectcards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .command,.secondary,.cols2,.cols3{grid-template-columns:minmax(0,1fr)}
  .hero-quote,.clock{display:none}
}
@media (max-width:760px){
  .app{display:block;width:100%;margin:0;border:0;border-radius:0;min-height:100vh;background:var(--frame)}
  .main{border-left:0}
  .hide-phone{display:none}
  .paper>.row.between:first-child{flex-direction:column;align-items:flex-start;gap:2px}
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:25;width:260px;height:100%;padding-top:max(24px, env(safe-area-inset-top));transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  .app.drawer-open .sidebar{transform:none}
  .app.drawer-open .backdrop{display:block;position:fixed;inset:0;z-index:24;border:0;background:var(--scrim)}
  .main{padding:max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom))}
  .topbar{margin-bottom:22px;gap:6px}
  .mobile-menu{display:inline-grid}
  .search-trigger{flex:1;width:auto;max-width:none;min-width:0}
  .search-trigger kbd{display:none}
  .icon-button,.round{width:42px;height:42px}
  .topright{gap:0}
  .tool-optional{display:none}
  .hero{margin-bottom:20px}
  .metric{height:116px;padding:15px}
  .metric-number{font-size:27px}
  .metric-foot{max-width:60%}
  .spark,.dots{width:40px;height:46px;right:12px;bottom:18px}
  .ring{width:44px;height:44px;margin-top:-22px;right:12px}
  .panel{padding:18px}
  .mission{min-height:0}
  .mission-title{font-size:19px}
  .projectcards,.field2{grid-template-columns:minmax(0,1fr)}
  .loggrid{grid-template-columns:minmax(0,1fr)}
  .agenda-detail{white-space:normal}
  .nav button,.quick button{min-height:44px}
  .btn{min-height:40px}
  .btn.small{min-height:36px}
  .input,select,textarea{font-size:16px}
  .timer{padding:24px 12px}
  .timerclock{font-size:62px}
  .toast{left:16px;right:16px;bottom:max(16px, env(safe-area-inset-bottom));max-width:none}
  .modal{padding:20px}
}
@media (max-width:420px){
  .metrics{gap:10px}
  .metric-foot{font-size:11px}
  .capture{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}

/* No visible scrollbar on the page or the sidebar; wheel, trackpad, touch and keys still scroll. Smaller scroll areas get a slim one in FUMO's colours. */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
html, .sidebar { scrollbar-width: none; }
html::-webkit-scrollbar, .sidebar::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="app" id="app">
  <button class="backdrop" data-action="closeDrawer" aria-label="Close navigation" tabindex="-1"></button>
  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="brandrow">
      <div class="logo"><div class="logotype">FUMO.</div></div>
      <button class="icon-button collapse-btn" id="collapseBtn" data-action="toggleSidebar" data-icon="collapse" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true"></button>
    </div>
    <nav class="nav" id="nav" aria-label="Main navigation"></nav>
    <div class="quick">
      <p class="quick-label">Quick actions</p>
      <button type="button" data-action="newNote" data-icon="note" aria-label="Capture a note" title="Capture a note"><span class="label">Capture note</span></button>
      <button type="button" data-action="newWaiting" data-icon="follow" aria-label="Add a follow-up" title="Add a follow-up"><span class="label">Add follow-up</span></button>
      <button type="button" data-action="newWorkout" data-icon="workout" aria-label="Log a workout" title="Log a workout"><span class="label">Log workout</span></button>
      <button type="button" data-action="newReading" data-icon="link" aria-label="Save a link" title="Save a link"><span class="label">Save a link</span></button>
      <button type="button" data-action="openJournal" data-icon="note" aria-label="Today’s journal" title="Today’s journal"><span class="label">Today’s journal</span></button>

  return `<nav class="deskbar" aria-label="Edition sections">${items.map(([k, l]) => `<button type="button" data-action="editionView" data-id="${esc(k)}"${editionView === k ? ' aria-current="page"' : ''}>${esc(l)}</button>`).join('')}</nav>`;
}
function editionNotice(ed) {

  if (editionCache?.error) return `<div class="notice" role="note">${icon('alert')}<span>Showing your saved copy from ${timeAgo(ed.generated)}. ${esc(editionCache.error)}</span>${btn('Try again', 'refreshEdition', { cls: 'small', ic: 'reset' })}</div>`;
  const age = (Date.now() - Date.parse(ed.generated)) / 36e5;
  if (age > 3) return `<div class="notice" role="note">${icon('alert')}<span>This edition is ${Math.round(age)} hours old. Your headline service may have paused — its status page will say why.</span>${btn('Refresh', 'refreshEdition', { cls: 'small', ic: 'reset' })}</div>`;
  return '';
}
function editionSetup() {
  if (state.editionPrefs.feedUrl) {

}
function renderFront(ed) {
  const { hero, top, desks } = frontPage(ed);
  if (!hero) return '<div class="panel empty">No stories in your enabled desks right now. Turn desks back on in edition settings.</div>';
  /* Topic alerts surface even from desks you have switched off: you asked for them by name. */
  const radar = state.editionPrefs.alerts.length ? ed.stories.filter(s => matchStory(s).alerts.length).sort((a, b) => Date.parse(b.published) - Date.parse(a.published)).slice(0, 5) : [];
  return `${marketStrip(ed)}${radar.length ? `<section class="radar" aria-label="Your topic alerts"><p class="section-label">On your radar</p>${radar.map(s => storyCard(s, 'brief')).join('')}</section>` : ''}<section class="front" aria-label="Front page"><div class="front-lead">${storyCard(hero, 'splash')}</div><div class="front-top"><p class="section-label">Top stories</p>${top.map(s => storyCard(s, 'top')).join('')}</div></section>
  <section class="desks-grid" aria-label="Across the desks">${desks.map(({ desk: d, stories }) => `<div class="desk-col"><h2 class="desk-name"><button type="button" class="text-button" data-action="editionView" data-id="${esc(d.id)}">${esc(d.name)}</button></h2>${stories.map((s, i) => storyCard(s, i === 0 ? 'thumb' : 'brief')).join('')}</div>`).join('')}</section>

/* Delayed quotes the headline service collects; FUMO never talks to a market-data provider itself. */
function marketStrip(ed) {
  const items = ed.markets || [];
  if (!items.length) return '';
  const fmt = (n, dp) => n.toLocaleString(LOCALE, { minimumFractionDigits: dp, maximumFractionDigits: dp });
  const newest = items.map(i => i.at).filter(Boolean).sort().pop();
  const via = [...new Set(items.filter(i => !i.stale).map(i => i.source).filter(Boolean))].join(' and ');
  return `<section class="markets" aria-label="Markets, delayed"><ul>${items.map(i => {
    const dir = i.pct == null ? '' : i.pct > 0 ? 'up' : i.pct < 0 ? 'down' : '';
    const pct = i.pct == null ? '' : `<span class="mk-chg ${dir}">${i.pct > 0 ? '▲' : i.pct < 0 ? '▼' : ''}${fmt(Math.abs(i.pct), 2)}%</span>`;
    return `<li${i.stale ? ' class="stale" title="Couldn’t refresh — last good quote"' : ''}><span class="mk-name">${esc(i.name)}</span><span class="mk-px">${fmt(i.price, i.price < 50 ? 4 : 2)}</span>${pct}</li>`;
  }).join('')}</ul><p class="micro">Delayed${via ? ` · ${esc(via)}` : ''}${newest ? ` · as of ${timeAgo(newest)}` : ''}. Not for trading decisions.</p></section>`;
}
function renderDesk(ed, id) {
  const d = deskList(ed).find(x => x.id === id) || { id, name: deskName(id), coverage: '' };
  const list = ed.stories.filter(s => s.desk === id).sort((a, b) => Date.parse(b.published) - Date.parse(a.published));
  const lead = (state.editionPrefs.images && list.slice(0, 4).find(s => s.image)) || list[0];
  const n = deskList(ed).findIndex(x => x.id === id);
  return `<section class="desk-head"><p class="eyebrow">${n >= 0 ? `Desk ${pad(n + 1)}` : 'Desk'}${deskWeight(id) === 0 ? ' · hidden from your front page' : ''}</p><h2 class="desk-title">${esc(d.name)}</h2>${d.coverage ? `<p class="lead">${esc(d.coverage)}</p>` : ''}</section>`
    + (id === 'wall' ? marketStrip(ed) : '')
    + (lead ? `<div class="desk-lead">${storyCard(lead, 'deskLead')}</div><div class="desk-list">${list.filter(s => s !== lead).slice(0, 30).map(s => storyCard(s, 'brief')).join('')}</div>` : '<div class="panel empty">Nothing on this desk right now.</div>');
}
function libraryResults() {

  const saved = state.reading.slice().reverse().filter(r => match(r.title, r.source, r.url, deskName(r.desk), r.summary));
  const history = Object.entries(state.editionRead).reverse().filter(([, h]) => match(h.t, h.s, deskName(h.d))).slice(0, 80);
  const current = q ? (editionData()?.stories || []).filter(s => match(s.title, s.source, s.summary, deskName(s.desk))).slice(0, 20) : [];
  const savedRows = saved.map(r => `<div class="listrow ${r.read ? 'is-read' : ''}"><div class="flex1">${r.storyId ? `<button type="button" class="headline-link" data-action="openStory" data-id="${esc(r.storyId)}">${esc(r.title || hostOf(r.url))}</button>` : `<a class="itemname" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" data-action="openReading" data-id="${r.id}">${esc(r.title || hostOf(r.url))}</a>`}<div class="itemdetail">${esc(deskName(r.desk))} · ${esc(r.source || hostOf(r.url))} · saved ${ago(r.added)}</div></div>${btn('', 'toggleRead', { cls: 'quiet small', id: r.id, ic: 'check', label: r.read ? 'Mark unread' : 'Mark read' })}${btn('', 'deleteReading', { cls: 'quiet small', id: r.id, ic: 'x', label: 'Remove from library' })}</div>`).join('');

  return `<div class="grid cols2">${panel('Saved', q ? `${saved.length} matching` : plural(saved.length, 'item'), savedRows || `<div class="empty">${q ? 'No saved items match.' : 'Save stories from the article view, or add any link.'}</div>`)}${panel('Reading history', q ? `${history.length} matching` : 'Stories you’ve opened', histRows || `<div class="empty">${q ? 'Nothing you’ve read matches.' : 'Stories you open appear here.'}</div>`)}</div>${q ? `<div class="mt">${panel('In the current edition', storyCount(current.length), current.map(s => storyCard(s, 'brief')).join('') || '<div class="empty">No current headlines match.</div>')}</div>` : ''}`;

function renderLibrary() {

/* ---------- Render pipeline ---------- */
const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
function focusKey(el) {
  if (!el || el === document.body || !el.dataset) return null;
  if (el.id) return '#' + cssEsc(el.id);
  if (!el.dataset.action) return null;
  let s = `[data-action="${cssEsc(el.dataset.action)}"]`;
  if (el.dataset.id) s += `[data-id="${cssEsc(el.dataset.id)}"]`;
  if (el.dataset.item) s += `[data-item="${cssEsc(el.dataset.item)}"]`;
  return s;
}
function setTitle() {
  const t = state.timer;
  document.title = t.running ? `${clockText(t.seconds)} ${t.mode === 'focus' ? 'Focus' : 'Break'} · FUMO` : `${PAGE_TITLES[page] || 'FUMO'} · FUMO`;
}
function renderNav() {
  const counts = { followups: openWaiting().length, inbox: state.inbox.length, edition: state.reading.filter(r => !r.read).length };
  $('#nav').innerHTML = NAV.map(([id, ic, label]) => `<button type="button" data-action="navigate" data-id="${id}" title="${label}" aria-label="${label}${counts[id] ? `, ${counts[id]}` : ''}"${page === id ? ' aria-current="page"' : ''}>${icon(ic)}<span class="label">${label}</span>${counts[id] ? `<span class="count">${counts[id]}</span>` : ''}</button>`).join('');
}
function updateTimerChip() {
  const t = state.timer, chip = $('#timerChip');
  chip.classList.toggle('on', t.running && page !== 'focus');
  if (t.running) {
    $('#timerChipText').textContent = `${t.mode === 'focus' ? 'Focus' : 'Break'} ${clockText(t.seconds)}`;
    chip.setAttribute('aria-label', `${t.mode === 'focus' ? 'Focus' : 'Break'} timer running, ${clockText(t.seconds)} left. Open Focus`);
  }
}
function renderChrome() {
  renderNav();
  const n = state.profile.name, light = document.documentElement.dataset.theme === 'light';
  $('#profileName').textContent = n || 'Set your name';
  $('#avatar').textContent = (n || 'F').charAt(0).toUpperCase();
  const tb = $('#themeBtn');
  tb.innerHTML = icon(light ? 'moon' : 'sun');
  tb.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
  tb.title = tb.getAttribute('aria-label');
  $('#searchKbd').textContent = IS_MAC ? '⌘ K' : 'Ctrl K';
  $('#clock').textContent = new Date().toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
  updateTimerChip();
}
function render(opts = {}) {
  const active = document.activeElement;
  const key = active && ($('#page').contains(active) || $('#nav').contains(active)) ? focusKey(active) : null;
  const drafts = {};
  $$('#page input[id]:not([type=checkbox]):not([type=radio]), #page textarea[id]').forEach(i => { if (i.value) drafts[i.id] = i.value; });
  renderChrome();
  let html;
  try { html = (PAGES[page] || renderCommand)(); } catch (err) { console.error(err); html = crashPanel(err); }
  $('#page').innerHTML = html;
  Object.entries(drafts).forEach(([id, v]) => { const i = document.getElementById(id); if (i && 'value' in i && !i.value) i.value = v; });
  setTitle();
  if (opts.focusHeading) $('#page h1')?.focus({ preventScroll: true });
  else if (key) { const el = document.querySelector(key); if (el) el.focus({ preventScroll: true }); }
}
function go(target) {
  const next = PAGES[target] ? target : 'command';
  if (page === 'pages' && next !== 'pages' && pageEdit) { finishPageEdit(); }
  if (next === 'edition' && page !== 'edition') {
    editionPrevVisit = state.editionPrefs.lastVisit;
    state.editionPrefs.lastVisit = new Date().toISOString();
    editionView = 'front'; save(); refreshEdition(false);
  }
  page = next;
  if (isMobile()) setDrawer(false, false);
  render({ focusHeading: true });
  window.scrollTo(0, 0);
}

/* ---------- Layout: collapsed rail on desktop, drawer on phones ---------- */
function applyLayout() {
  const app = $('#app'), mobile = isMobile(), open = mobile && app.classList.contains('drawer-open');
  if (!mobile) app.classList.remove('drawer-open');
  app.classList.toggle('collapsed', !mobile && prefCollapsed);
  $('#sidebar').inert = mobile && !open;
  $('#menuBtn').setAttribute('aria-expanded', String(open));
  const cb = $('#collapseBtn');
  cb.setAttribute('aria-expanded', String(mobile ? open : !prefCollapsed));
  cb.setAttribute('aria-label', mobile ? 'Close navigation' : prefCollapsed ? 'Expand sidebar' : 'Collapse sidebar');
  cb.title = cb.getAttribute('aria-label');
}
function setDrawer(open, moveFocus = true) {
  $('#app').classList.toggle('drawer-open', open);
  applyLayout();
  if (!moveFocus) return;
  if (open) $('#nav button')?.focus(); else $('#menuBtn').focus();
}

/* ---------- Modals ---------- */
function showModal(title, html, opts = {}) {
  const key = opts.refresh ? focusKey(document.activeElement) : null;
  if (!modal) modalOpenerKey = focusKey(document.activeElement);
  modal = title;
  $('#modal').className = 'modal ' + (opts.size || '');
  $('#modaltitle').textContent = title;
  $('#modalcontent').innerHTML = html;
  $('#modalback').classList.add('open');
  $('#app').inert = true;
  const restore = key && $('#modalcontent').querySelector(key);
  if (restore) { restore.focus(); return; }
  const first = $('#modalcontent').querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),textarea,select');
  (first || $('#modal [data-action=closeModal]')).focus();
}
function closeModal() {
  if (!modal) return;
  modal = null;
  clearInterval(breathTimer); breathTimer = null;
  $('#modalback').classList.remove('open');
  $('#modalcontent').innerHTML = '';
  $('#app').inert = false;
  const el = modalOpenerKey && document.querySelector(modalOpenerKey);
  (el || $('#page h1') || $('#main')).focus?.({ preventScroll: true });
}
function trapFocus(e) {
  const f = $$('#modal button:not(:disabled), #modal input:not([type=hidden]):not(:disabled), #modal textarea, #modal select:not(:disabled), #modal a[href]').filter(x => x.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
}

  showModal('Breathing reset', `<p class="muted">Two minutes of paced box breathing. Breathe naturally if the holds are uncomfortable, and stop if you feel dizzy.</p><div class="breathwrap"><svg class="breathring" viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="104"/><circle class="trace" id="breathtrace" cx="110" cy="110" r="104" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 110 110)"/>${[[110, 6], [214, 110], [110, 214], [6, 110]].map(([x, y]) => `<circle class="tick" cx="${x}" cy="${y}" r="2.5"/>`).join('')}<circle class="dot" id="breathdot" cx="110" cy="6" r="6"/></svg><div class="breath" id="breath"><b id="breathlabel" aria-live="polite">Ready</b><span id="breathcount">4 · 4 · 4 · 4</span></div></div><div class="row" style="justify-content:center">${btn('Begin', 'beginBreath', { cls: 'primary', ic: 'play' })}${btn('Stop', 'stopBreath')}</div><p class="hint mt" style="text-align:center">Or: a short walk, or five minutes with your eyes off the screen.</p>`);

/* Box breathing, 4s per phase. Everything is computed from the start time, so the circle, the dot and the count never drift apart.
   The circle grows through the inhale, stays full on the hold, shrinks through the exhale, stays small on the hold.
   The dot travels the outer ring: one quarter per phase, one lap per breath. */
function breathDraw(e) {
  const el = $('#breath'), trace = $('#breathtrace'), dot = $('#breathdot');
  if (!el || !trace || !dot) return;
  const k = Math.floor(e / 4) % 4, ease = (1 - Math.cos(Math.PI * (e % 4) / 4)) / 2;
  const scale = [1 + 0.3 * ease, 1.3, 1.3 - 0.3 * ease, 1][k];
  el.style.transform = matchMedia('(prefers-reduced-motion: reduce)').matches ? '' : `scale(${scale.toFixed(3)})`;
  const lap = (e % 16) / 16, a = 2 * Math.PI * lap - Math.PI / 2;
  trace.setAttribute('stroke-dasharray', `${(lap * 100).toFixed(2)} 100`);
  dot.setAttribute('cx', (110 + 104 * Math.cos(a)).toFixed(1)); dot.setAttribute('cy', (110 + 104 * Math.sin(a)).toFixed(1));
}
function doBreath() {
  clearInterval(breathTimer);
  const start = Date.now(), names = ['Inhale', 'Hold', 'Exhale', 'Hold'], total = 128; // 8 full breaths, so it ends after an exhale
  const update = () => {
    if (!$('#breath')) return clearInterval(breathTimer);
    const e = (Date.now() - start) / 1000;
    if (e >= total) { clearInterval(breathTimer); breathDraw(0); $('#breathlabel').textContent = 'Complete'; $('#breathcount').textContent = 'Eight breaths done'; return; }
    const k = Math.floor(e / 4) % 4, label = $('#breathlabel');
    if (label.textContent !== names[k]) label.textContent = names[k];
    $('#breathcount').textContent = `${4 - Math.floor(e % 4)} seconds`;
    breathDraw(e);
  };
  update(); breathTimer = setInterval(update, 30);
}

const GENERIC_CLIENT = /^(own product|no client|example client)$/i;
const termPatterns = new Map();
function hasTerm(text, term) {
  let re = termPatterns.get(term);
  if (!re) { re = new RegExp(`(^|[^\\p{L}\\p{N}])${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}($|[^\\p{L}\\p{N}])`, 'iu'); termPatterns.set(term, re); }
  return re.test(text);
}
const projectTerms = p => [...p.keywords, ...(p.client && !GENERIC_CLIENT.test(p.client) ? [p.client] : []), p.title].filter(t => t && t.length >= 3);

}

/* ---------- Actions ---------- */
const val = sel => ($(sel)?.value ?? '').trim();
function doAction(a, key, el) {
  let x;
  switch (a) {
    /* Navigation and chrome */
    case 'navigate': if (key === 'trading') { location.href = 'trading/'; break; } go(key); break; // Trading is its own page
    case 'goRenewals': go('projects'); $('#renewals')?.scrollIntoView({ block: 'start' }); break;
    case 'openDrawer': setDrawer(true); break;
    case 'closeDrawer': setDrawer(false); break;
    case 'toggleSidebar':
      if (isMobile()) { setDrawer(false); break; }
      prefCollapsed = !prefCollapsed;
      try { localStorage.setItem(UI_SIDEBAR, prefCollapsed ? 'collapsed' : 'expanded'); } catch (e) {}
      applyLayout(); break;
    case 'toggleTheme': {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem(UI_THEME, next); } catch (e) {}
      renderChrome(); break;
    }
    case 'openSearch': searchForm(); break;
    case 'closeModal': closeModal(); break;
    case 'undo':
      if (toastUndo) { const fn = toastUndo; toastUndo = null; fn(); save(); render(); toast('Undone'); }
      break;

    /* Inbox */
    case 'newNote': noteForm(); break;
    case 'saveNote': {
      const text = val('#noteText');
      if (!text) return toast('Write something first');
      state.inbox.push({ id: uid(), text: text.slice(0, 2000), created: new Date().toISOString(), projectId: val('#noteProject') });
      save(); closeModal(); render(); toast('Note captured'); break;
    }
    case 'capture': {
      const input = $('#capture'), text = input?.value.trim();
      if (!text) return input?.focus();
      state.inbox.push({ id: uid(), text: text.slice(0, 2000), created: new Date().toISOString(), projectId: '' });
      input.value = ''; save(); render(); toast('Captured'); break;
    }
    case 'deleteInbox': withUndo('Note deleted', () => { state.inbox = state.inbox.filter(n => n.id !== key); }); break;
    case 'routeNote': x = state.inbox.find(n => n.id === key); if (x) routeForm(x); break;
    case 'saveRoute': {
      const n = state.inbox.find(i => i.id === val('#routeId')), p = projectById(val('#routeProject'));
      if (!n || !p) return toast('Pick a project');
      if ($('input[name=routeMode]:checked')?.value === 'next') {
        closeModal();
        withUndo(`Now the next action for ${p.title}`, () => { p.next = n.text.slice(0, 1000); state.inbox = state.inbox.filter(i => i.id !== n.id); });
      } else { n.projectId = p.id; save(); closeModal(); render(); toast(`Tagged to ${p.title}`); }
      break;
    }

    /* Projects */
    case 'newProject': projectForm(); break;
    case 'editProject': x = projectById(key); if (x) projectForm(x); break;
    case 'openProject': x = projectById(key); if (x) projectModal(x.id); break;
    case 'saveProject': {
      const title = val('#ptitle');
      if (!title) return toast('Give the project a name');
      const { out, bad } = parseLinks($('#plinks').value);
      if (bad.length) return toast(`Couldn’t read this link: ${bad[0].slice(0, 60)}`);
      const data = { title: title.slice(0, 150), client: val('#pclient').slice(0, 80), due: dayOr(val('#pdue')), status: oneOf(val('#pstatus'), STATUSES, 'Active'), priority: oneOf(val('#ppriority'), PRIORITIES, 'Medium'), next: val('#pnext').slice(0, 1000), blocker: val('#pblocker').slice(0, 700), links: out, keywords: splitTerms(val('#pkeywords')).slice(0, 10) };
      const p = projectById(val('#pid'));
      if (p) Object.assign(p, data); else state.projects.push({ id: uid(), ...data, log: [], checks: {}, archived: false });
      save(); closeModal(); render(); toast(p ? 'Project updated' : 'Project added'); break;
    }
    case 'archiveProject': x = projectById(key); if (x) withUndo(`${x.title} archived`, () => { x.archived = true; }); break;
    case 'archiveModal': {
      const list = state.projects.filter(p => p.archived);
      showModal('Archived projects', list.map(p => `<div class="listrow"><div class="flex1"><div class="itemname">${esc(p.title)}</div><div class="itemdetail">${esc(clientOf(p))}</div></div>${btn('Restore', 'restoreProject', { cls: 'small', id: p.id })}</div>`).join('') || '<div class="empty">No archived projects.</div>');
      break;
    }
    case 'restoreProject': x = projectById(key); if (x) { x.archived = false; save(); closeModal(); render(); toast(`${x.title} restored`); } break;
    case 'clientFilter': clientFilter = key; render(); break;
    case 'newPage': newPage(); break;
    case 'pickTemplate': showModal('New page', `<div class="pagelist">${Object.entries(TEMPLATES).map(([k, [t, d]]) => `<button type="button" class="search-result" data-action="newFromTemplate" data-id="${k}"><strong>${t}</strong><small>${d}</small></button>`).join('')}</div>`); break;
    case 'newFromTemplate': newFromTemplate(key); break;
    case 'projectNotes': if (modal) closeModal(); openProjectNotes(key); break;
    case 'inboxToJournal': x = state.inbox.find(n => n.id === key); if (x) withUndo('Added to today’s journal', () => { appendJournal(today(), x.text); state.inbox = state.inbox.filter(n => n !== x); }); break;
    case 'inboxToPage': {
      x = state.inbox.find(n => n.id === key);
      if (!x) break;
      const g = { id: uid(), title: x.text.split('\n')[0].slice(0, 60).trim() || 'Untitled', body: x.text, updated: Date.now(), day: '', projectId: x.projectId || '' };
      withUndo('Turned into a page', () => { state.pages.push(g); state.inbox = state.inbox.filter(n => n !== x); });
      openPage(g.id); break;

    case 'renewYear': x = state.renewals.find(r => r.id === key); if (x) { const d = parseDay(x.date); d.setFullYear(d.getFullYear() + 1); x.date = dayKey(d); save(); closeModal(); render(); toast(`${x.name} now renews ${fmtDay(x.date, { day: 'numeric', month: 'short', year: 'numeric' })}`); } break;
    case 'deleteRenewal': closeModal(); withUndo('Renewal removed', () => { state.renewals = state.renewals.filter(r => r.id !== key); }); break;

    case 'newReading': readingForm(); break;

    }
    case 'openReading': x = state.reading.find(r => r.id === key); if (x && !x.read) { x.read = true; save(); setTimeout(render, 400); } break;
    case 'openReadingTab': x = state.reading.find(r => r.id === key); if (x) { window.open(x.url, '_blank', 'noopener,noreferrer'); x.read = true; save(); closeModal(); render(); } break;
    case 'toggleRead': x = state.reading.find(r => r.id === key); if (x) { x.read = !x.read; save(); render(); } break;
    case 'deleteReading': withUndo('Link removed', () => { state.reading = state.reading.filter(r => r.id !== key); }); break;

    case 'linkStoryToProject': {

    case 'editionSettings': editionSettingsForm(); break;
    case 'editionSources': sourcesModal(); break;
    case 'saveEditionSettings': {
      const raw = val('#edFeed'), repo = /\.json(\?|$)/i.test(raw) ? '' : parseRepo(raw), url = !raw ? '' : repo ? `github:${repo}` : toUrl(raw), key = val('#edKey');

    case 'refreshEdition': if (state.editionPrefs.feedUrl) refreshEdition(true); else editionSettingsForm(); break;

    case 'addReadingBlock':

    case 'deleteHabit': if (confirm('Delete this habit and its history?')) { const id = val('#hid'); closeModal(); withUndo('Habit deleted', () => { state.habits = state.habits.filter(h => h.id !== id); }); } break;
    case 'toggleHabit': x = state.habits.find(h => h.id === key); if (x) { if (el?.checked ?? !x.history[today()]) { x.history[today()] = true; x.grace = x.grace.filter(d => d !== today()); } else delete x.history[today()]; save(); render(); } break;
    case 'graceHabit': x = state.habits.find(h => h.id === key); if (x && graceAllowed(x)) { x.grace.push(today()); save(); render(); toast('Rest day recorded'); } break;
    case 'newBlock': blockForm(); break;
    case 'editBlock': x = state.blocks.find(b => b.id === key); if (x) blockForm(x); break;

    case 'toggleBlock': x = state.blocks.find(b => b.id === key); if (x) { x.done = el ? el.checked : !x.done; save(); render(); } break;

    /* Training */
    case 'newWorkout': workoutForm(); break;
    case 'saveWorkout': {
      const title = val('#wtitle'), mins = Number(val('#wminutes')), date = dayOr(val('#wdate'));

      if (bad.length) return toast(`Use “name sets x reps”, e.g. Pull-ups 3x8. Couldn’t read: ${bad[0].slice(0, 40)}`);
      state.workouts.push({ id: uid(), title: title.slice(0, 150), type: oneOf(val('#wtype'), WORKOUT_TYPES, 'Other'), minutes: Math.round(mins), date, notes: val('#wnotes').slice(0, 600), skills: out });
      save(); closeModal(); render(); toast('Session logged'); break;
    }
    case 'deleteWorkout': withUndo('Workout deleted', () => { state.workouts = state.workouts.filter(w => w.id !== key); }); break;

    /* Must-wins and shutdown */
    case 'winsModal': winsForm(); break;
    case 'saveWins': {
      const wins = [0, 1, 2].map(i => val('#win' + i).slice(0, 300)), target = val('#winsFor') === 'tomorrow' ? tomorrow() : today();
      state.winsDone = wins.map((w, i) => !!w && w === state.wins[i] && target === state.winsDate && state.winsDone[i]);
      state.wins = wins; state.winsDate = target;
      save(); closeModal(); render(); break;
    }
    case 'toggleWin': {
      const i = Number(key);
      if (winsMode() !== 'today' || !state.wins[i]) break;
      state.winsDone[i] = el?.type === 'checkbox' ? el.checked : !state.winsDone[i];
      save(); render();
      if (state.wins.every((w, j) => !w || state.winsDone[j])) toast('All must-wins done. That’s a win.');
      break;
    }
    case 'shutdownModal': shutdownForm(); break;
    case 'completeShutdown': {
      if (!$('#reviewed').checked) return toast('Tick the review step first');
      const wins = [0, 1, 2].map(i => val('#win' + i).slice(0, 300)).filter(Boolean);
      if (!wins.length) return toast('Set at least one must-win for tomorrow');
      const ship = projectById(val('#shipProject')), shipNote = val('#shipNote'), wipe = $('#wipe').checked;
      if (ship && !shipNote) return toast('Add a line about what shipped');
      if (wipe && state.inbox.length && !confirm('Permanently clear your inbox?')) return;
      if (ship) ship.log.push({ id: uid(), date: today(), version: '', note: shipNote.slice(0, 1000) });
      const note = val('#journalNote').slice(0, 5000), entry = ['## Evening shutdown', ship ? `- Shipped on ${ship.title}: ${shipNote}` : '', `- Tomorrow: ${wins.join(' · ')}`, note ? `\n${note}` : ''].filter(Boolean).join('\n');
      appendJournal(today(), entry);
      state.wins = [0, 1, 2].map(i => wins[i] || ''); state.winsDone = [false, false, false]; state.winsDate = tomorrow(); state.shutdownDate = today();
      if (wipe) state.inbox = [];
      if (state.timer.running) { timerSync(); state.timer.running = false; state.timer.end = 0; }
      const h = state.habits.find(i => /shutdown/i.test(i.title)); if (h) h.history[today()] = true;
      save(); closeModal(); render(); toast('Workday closed and saved to today’s journal.'); break;
    }

    /* Focus timer */
    case 'focusOn': {
      const t = state.timer, pid = key || '';
      timerSync();
      if (t.running && t.mode === 'focus') { if (pid !== t.projectId) toast('A focus session is already running'); }
      else {
        if (t.mode !== 'focus' || t.running || !t.seconds || (pid !== t.projectId && t.seconds < t.length)) resetTimer('focus');
        t.projectId = pid; t.running = true; t.end = Date.now() + t.seconds * 1000;
        toast(`Focus started${projectName(pid) ? ' on ' + projectName(pid) : ''}`);
      }
      save(); closeModal(); go('focus'); break;
    }
    case 'timerToggle': {
      const t = state.timer;
      if (timerSync()) { render(); break; }
      if (t.running) { t.running = false; t.end = 0; }
      else { if (!t.seconds) resetTimer(t.mode); t.running = true; t.end = Date.now() + t.seconds * 1000; }
      save(); render(); break;
    }
    case 'timerFinish': {
      const t = state.timer;

      if (t.mode !== 'focus') break;
      const mins = Math.round((t.length - t.seconds) / 60), pid = t.projectId;
      logSession(mins, pid); resetTimer('break');
      save(); render(); toast(mins >= 1 ? `Logged ${mins} min${projectName(pid) ? ' to ' + projectName(pid) : ''}` : 'Too short to log');
      break;
    }
    case 'timerReset': resetTimer(state.timer.mode); save(); render(); break;
    case 'timerSwitch': resetTimer(state.timer.mode === 'focus' ? 'break' : 'focus'); save(); render(); break;
    case 'resetModal': breathForm(); break;
    case 'beginBreath': doBreath(); break;
    case 'stopBreath': clearInterval(breathTimer); breathTimer = null; if ($('#breath')) { breathDraw(0); $('#breathlabel').textContent = 'Stopped'; } break;

    /* Settings and data */
    case 'saveProfile': state.profile.name = val('#profileNameInput').slice(0, 40); save(); render(); toast('Name saved'); break;
    case 'saveSettings': {
      const f = Number(val('#focusDuration')), b = Number(val('#breakDuration'));
      if (!Number.isInteger(f) || !Number.isInteger(b) || f < 1 || f > 240 || b < 1 || b > 120) return toast('Focus: 1–240 min. Break: 1–120 min.');
      state.settings = { focus: f, break: b };

      save(); render(); toast('Durations saved'); break;
    }
    case 'saveChecklist': {
      const items = [...new Set($('#checklistInput').value.split('\n').map(s => s.trim().slice(0, 200)).filter(Boolean))].slice(0, 15);
      state.checklist = items; save(); render(); toast('Checklist saved'); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }), u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = `fumo-backup-${today()}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(u), 1000); toast('Backup downloaded'); break;
    }
    case 'import': $('#importfile').click(); break;
    case 'saveSync': {
      const repo = parseRepo(val('#syncRepo')), key = val('#syncKey');
      if (!repo) return toast('Enter your data repository as name/repo');
      if (key && !/^[\w-]{20,300}$/.test(key)) return toast('That doesn’t look like a GitHub access key');
      if (!key && !getEditionKey()) return toast('Paste your access key too');
      if (key) setEditionKey(key);
      if (repo !== state.sync.repo) { local.set(SYNC_BASE, null); local.set(SYNC_SHA, null); }
      state.sync.repo = repo; syncError = ''; persist(); local.set(SYNC_DIRTY, '1');
      render(); toast('Syncing…'); syncNow(); break;
    }
    case 'syncNow': syncError = ''; render(); syncNow(); break;
    case 'syncOff':
      if (!confirm('Turn off sync on this device? Your records stay here and in your repository.')) break;
      state.sync.repo = ''; [SYNC_BASE, SYNC_SHA, SYNC_DIRTY].forEach(k => local.set(k, null)); syncError = ''; persist(); render(); toast('Sync is off on this device'); break;
    case 'factoryReset': if (confirm('Erase all FUMO data in this browser? This cannot be undone.')) { state = normalize(seed()); [SYNC_BASE, SYNC_SHA, SYNC_DIRTY].forEach(k => local.set(k, null)); save(); go('command'); toast('FUMO reset. Sync is off on this device.'); } break;
  }
}

async function importFile(file) {
  if (!file) return;
  if (file.size > 5e6) return toast('That backup is too large');
  try {
    const next = normalize(JSON.parse(await file.text()));
    if (!confirm(`Replace everything${syncOn() ? ' on every synced device' : ' here'} with this backup (${plural(next.projects.length, 'project')})?`)) return;
    next.sync = state.sync;
    state = next; state.timer.running = false; state.timer.end = 0;
    save(); go('command'); toast('Backup restored');
  } catch (e) { toast('Import failed: ' + e.message); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.matches('input[type=checkbox]')) return;
  doAction(el.dataset.action, el.dataset.id, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input[type=checkbox][data-action]')) doAction(el.dataset.action, el.dataset.id, el);
  else if (el.dataset.change === 'timerProject') { state.timer.projectId = el.value; save(); }
  else if (el.id === 'pageTitle') { const g = pageById(pageId); if (g && g.title.trim()) { relinkPages(pageEditFrom, g.title.trim()); pageEditFrom = g.title.trim(); save(); } }
  else if (el.dataset.change === 'projectStatus') moveProject(el.dataset.id, el.value);
  else if (el.id === 'importfile') { importFile(el.files?.[0]); el.value = ''; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'globalSearch') searchResults(e.target.value);
  else if (e.target.id === 'pageTitle' || e.target.id === 'pageBody') {
    const g = pageById(pageId);
    if (!g) return;
    g[e.target.id === 'pageTitle' ? 'title' : 'body'] = e.target.value; g.updated = Date.now();
    clearTimeout(pageSaveTimer); pageSaveTimer = setTimeout(save, 400);
  }
  else if (e.target.id === 'libSearch') { libraryQuery = e.target.value; const r = $('#libResults'); if (r) r.innerHTML = libraryResults(); }
});
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { if (e.target.closest?.('[data-drop]')) e.preventDefault(); });
document.addEventListener('drop', e => { const col = e.target.closest?.('[data-drop]'); if (!col) return; e.preventDefault(); moveProject(e.dataTransfer.getData('text/plain'), col.dataset.drop); });
/* A publisher photo that fails to load is removed rather than left as an empty box. */
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG') (t.closest('.figure') || t).remove(); }, true);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchForm(); return; }
  if (e.key === 'Escape') { if (modal) closeModal(); else if ($('#app').classList.contains('drawer-open')) setDrawer(false); return; }
  if (e.key === 'Tab' && modal) { trapFocus(e); return; }
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (e.target.id === 'capture') { e.preventDefault(); doAction('capture'); }
  else if (e.target.id === 'globalSearch') { e.preventDefault(); $('#searchResults .search-result')?.click(); }
  else if (e.target.id === 'logVersion' || e.target.id === 'logNote') { e.preventDefault(); $('#modal [data-action=addLog]')?.click(); }
  else if (modal && e.target.matches('#modal input.input')) { e.preventDefault(); $('#modal .modalactions .btn.primary')?.click(); }
});
$('#modalback').addEventListener('click', e => { if (e.target.id === 'modalback') closeModal(); });
matchMedia(MOBILE).addEventListener?.('change', applyLayout);
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try { state = normalize(JSON.parse(e.newValue)); if (!modal && !editingPage()) render(); } catch (err) {}
});
window.addEventListener('error', e => toast(`Something went wrong: ${e.message}`));

/* ---------- Clock: timer, day rollover and a gentle refresh of the dashboard ---------- */
function rollover() {
  if (state.lastDay === today()) return false;
  state.lastDay = today();
  state.blocks.forEach(b => { b.done = false; });
  save(); return true;
}
function tick() {
  let dirty = rollover();
  const t = state.timer;
  if (t.running) {
    if (timerSync()) dirty = true;
    else {
      const el = $('#timerclock'); if (el) el.textContent = clockText(t.seconds);
      const b = $('#timerbar'); if (b) { const p = Math.round((1 - t.seconds / (t.length || 1)) * 100); b.firstElementChild.style.width = p + '%'; b.setAttribute('aria-valuenow', p); }
    }
  }
  const m = new Date().getMinutes();
  if (m !== lastMinute) {
    $('#clock').textContent = new Date().toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
    if (lastMinute !== -1 && m % 5 === 0 && page === 'command' && !modal) dirty = true;
    if (state.editionPrefs.feedUrl && document.visibilityState !== 'hidden') refreshEdition(false);
    if (m % 2 === 0 && syncOn() && document.visibilityState !== 'hidden') syncNow();

  }

}


/* ---------- Sync: your records travel between devices through a private GitHub repository ---------- */
/* The key and the last-synced copy stay on this device; only the records themselves are shared. */
const SYNC_FILE = 'fumo-data.json', SYNC_BASE = 'fumo.sync.base', SYNC_SHA = 'fumo.sync.sha', SYNC_DIRTY = 'fumo.sync.dirty';
const COLLECTIONS = ['blocks', 'projects', 'habits', 'inbox', 'workouts', 'sessions', 'waiting', 'renewals', 'reading', 'pages'];

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
/* The running timer's countdown changes every second; it is not an edit. */
const snapshot = () => JSON.stringify({ ...state, timer: { ...state.timer, seconds: 0 } });

/* Three-way merge. A record changed on only one side keeps that change, deletions included.

function mergeById(base, mine, theirs) {
  const B = new Map(base.map(x => [x.id, x])), M = new Map(mine.map(x => [x.id, x])), T = new Map(theirs.map(x => [x.id, x]));

function syncStatusText() {

  if (!getEditionKey()) return 'Waiting for your access key.';

}
function syncPanel() {
  const repo = state.sync.repo, owner = editionRepo().split('/')[0], guess = owner ? `${owner}/fumo-data` : '';
  return panel('Sync across devices', esc(syncStatusText()), `<div class="fields">
    ${field('syncRepo', 'Data repository', repo || guess, 'text', 'placeholder="your-name/fumo-data" maxlength="140" autocomplete="off" spellcheck="false"')}
    ${field('syncKey', 'Access key', '', 'password', `placeholder="${getEditionKey() ? 'Saved — leave empty to keep it' : 'github_pat_…'}" maxlength="300" autocomplete="off" spellcheck="false"`)}
    <p class="hint">A private GitHub repository holds your records so your phone and computer stay in step. The key is the same one The Daily Edition uses and needs <em>Contents: Read and write</em> on this repository. It stays on each device and is never synced or backed up.</p>
  </div><div class="actions mt">${btn(repo ? 'Save' : 'Turn on sync', 'saveSync', { cls: 'primary' })}${repo ? btn('Sync now', 'syncNow', { ic: 'reset' }) + btn('Turn off', 'syncOff', { cls: 'quiet' }) : ''}</div>`);
}

rollover();

refreshEdition(false);

setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (syncOn()) syncNow(); });

})();
